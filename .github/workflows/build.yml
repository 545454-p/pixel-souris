      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler l'application
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk PixelSouris.apk

      - name: Garder une copie
        uses: actions/upload-artifact@v4
        with:
          name: PixelSouris
          path: PixelSouris.apk

      - name: Publier en téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pixel Souris v${{ github.run_number }}
          body: Téléchargez PixelSouris.apk sur votre téléphone et ouvrez-le pour l'installer.
          files: PixelSouris.apk
