name: Fabriquer l'APK Pixel Souris

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Créer le projet
        run: |
          mkdir -p "."
          cat > "settings.gradle.kts" <<'PIXEL_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PhoneMouse"
          include(":app")
          PIXEL_EOF
          mkdir -p "."
          cat > "build.gradle.kts" <<'PIXEL_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          PIXEL_EOF
          mkdir -p "."
          cat > "gradle.properties" <<'PIXEL_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          PIXEL_EOF
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'PIXEL_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.phonemouse"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.phonemouse"
                  minSdk = 28          // BluetoothHidDevice existe depuis Android 9
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              // Clé de signature fixe : permet d'installer chaque nouvelle version par-dessus l'ancienne
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("pixel.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          PIXEL_EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'PIXEL_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Android 11 et moins -->
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <!-- Android 12 et plus -->
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <!-- Lecture rapide de l'accéléromètre (mode table) -->
              <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />

              <uses-feature android:name="android.hardware.bluetooth" android:required="true" />
              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="true" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PIXEL_EOF
          mkdir -p "app/src/main/res/values"
          cat > "app/src/main/res/values/strings.xml" <<'PIXEL_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Pixel Souris</string>
          </resources>
          PIXEL_EOF
          mkdir -p "app/src/main/res/layout"
          cat > "app/src/main/res/layout/activity_main.xml" <<'PIXEL_EOF'
          <?xml version="1.0" encoding="utf-8"?>
